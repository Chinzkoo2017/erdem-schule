<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erdem Schule – Хуваарь / Termine</title>
  <link rel="icon" href="images/logo.jpg">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/base.css">
  <style>
    header { background: linear-gradient(160deg, var(--navy-950), var(--navy)); color: #fff; }
    .in { width: min(900px, 100% - 2rem); margin-inline: auto; }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .brand { display: flex; gap: .7rem; align-items: center; font-family: var(--font-d); font-weight: 800; }
    .brand img { width: 42px; height: 42px; border-radius: 50%; }
    .lang-toggle { display: inline-flex; border: 1.5px solid rgba(255,255,255,.35); border-radius: 999px; padding: 2px; background: none; cursor: pointer; font-weight: 800; font-size: .72rem; margin-left: .8rem; }
    .lang-toggle span { padding: .25rem .6rem; border-radius: 999px; color: var(--on-dark-muted); }
    .lang-toggle span.on { background: var(--gold-2); color: var(--on-gold); }
    .nav a.home { font-weight: 700; font-size: .9rem; }
    h1 { font-family: var(--font-d); font-size: clamp(1.8rem, 4vw, 2.6rem); padding: 1.5rem 0 2.5rem; }
    .sub { color: var(--on-dark-muted); margin: -1.8rem 0 2rem; }
    .list { display: grid; gap: 1rem; padding: 2rem 0 4rem; }
    .ev { display: grid; grid-template-columns: 84px 1fr auto; gap: 1.2rem; align-items: center; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--blue); border-radius: 18px; padding: 1rem 1.3rem; box-shadow: var(--shadow); }
    .ev.on { border-left-color: var(--ok); }
    .ev .d { text-align: center; background: linear-gradient(160deg, var(--navy), var(--navy-2)); color: #fff; border-radius: 14px; padding: .5rem; }
    .ev .d b { display: block; font-size: 1.7rem; font-family: var(--font-d); color: var(--gold-2); line-height: 1.1; }
    .ev .d small { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; }
    .ev h3 { color: var(--navy); }
    .ev p { margin: .25rem 0 0; color: var(--muted); font-size: .88rem; }
    .past { opacity: .55; }
    h2.sec { font-family: var(--font-d); color: var(--navy); margin: 1rem 0 0; }
    @media (max-width: 600px) { .ev { grid-template-columns: 70px 1fr; } .ev .chip { grid-column: 2; justify-self: start; } }
  </style>
</head>
<body>
  <header>
    <div class="in nav">
      <a class="brand" href="index.html"><img src="images/logo.jpg" alt=""><span>Erdem Schule</span></a>
      <div><a class="home" href="index.html" data-i18n="common.home">Нүүр хуудас</a><button class="lang-toggle" data-lang-toggle type="button"></button></div>
    </div>
    <div class="in"><h1 data-i18n="sc.h">Хичээлийн хуваарь</h1><p class="sub" data-i18n="sc.sub">2026 / 2027 оны хичээлийн жил</p></div>
  </header>
  <main class="in"><div id="list" class="list"></div></main>

  <script type="module">
    import { loadPublic } from './js/public.js';
    import { esc } from './js/util.js';
    import { extend, t, pick, apply, onLang } from './js/i18n.js';

    extend({
      mn: { 'sc.h': 'Хичээлийн хуваарь', 'sc.sub': '2026 / 2027 оны хичээлийн жил', 'sc.upcoming': 'Ойрын арга хэмжээ', 'sc.past': 'Өнгөрсөн', 'sc.none': 'Одоогоор хуваарь оруулаагүй байна.' },
      de: { 'sc.h': 'Unterrichtskalender', 'sc.sub': 'Schuljahr 2026 / 2027', 'sc.upcoming': 'Kommende Termine', 'sc.past': 'Vergangen', 'sc.none': 'Noch keine Termine eingetragen.' },
    });
    apply();

    let rows = [];
    const card = (e, past) => {
      const d = new Date(e.date + 'T00:00:00'), online = e.type === 'Онлайн';
      return `<div class="ev ${online ? 'on' : ''} ${past ? 'past' : ''}"><div class="d"><b>${d.getDate()}</b><small>${t('month.' + (d.getMonth() + 1))}</small></div>
        <div><h3>${esc(pick(e, 'title'))}</h3><p>${esc(e.time || '')} · ${esc(e.place || '')} · ${esc(e.group || '')}</p></div>
        <span class="chip ${online ? 'blue' : 'green'}">${online ? t('common.online') : t('common.onsite')}</span></div>`;
    };
    const draw = () => {
      const today = new Date().toISOString().slice(0, 10);
      const up = rows.filter((e) => e.date >= today).sort((a, b) => a.date.localeCompare(b.date));
      const past = rows.filter((e) => e.date < today).sort((a, b) => b.date.localeCompare(a.date));
      document.getElementById('list').innerHTML = rows.length
        ? (up.length ? `<h2 class="sec">${t('sc.upcoming')}</h2>${up.map((e) => card(e)).join('')}` : '')
          + (past.length ? `<h2 class="sec">${t('sc.past')}</h2>${past.map((e) => card(e, true)).join('')}` : '')
        : `<div class="empty">${t('sc.none')}</div>`;
    };
    loadPublic().then(({ events }) => { rows = events; draw(); });
    onLang(draw);
  </script>
</body>
</html>
